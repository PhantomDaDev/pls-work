<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Appointment Request</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 8px; margin-bottom: 10px; }
        #teacherField { display: none; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h2>School Appointment Request</h2>
    <form id="appointmentForm">
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label for="appointmentWith">Request Appointment With:</label>
            <select id="appointmentWith" required onchange="toggleTeacherField()">
                <option value="">Select Staff Member</option>
                <option value="Principal">Principal</option>
                <option value="Vice Principal">Vice Principal</option>
                <option value="KG Supervisor">KG Supervisor</option>
                <option value="1-2 Supervisor">1-2 Supervisor</option>
                <option value="3-5 Supervisor">3-5 Supervisor</option>
                <option value="6-8 Supervisor">6-8 Supervisor</option>
                <option value="9-12 Supervisor">9-12 Supervisor</option>
                <option value="Admissions Department">Admissions Department</option>
                <option value="Teacher">Teacher</option>
            </select>
        </div>

        <div class="form-group" id="teacherField">
            <label for="teacherName">Specify Teacher Name:</label>
            <input type="text" id="teacherName">
        </div>

        <div class="form-group">
            <label for="date">Preferred Appointment Date:</label>
            <input type="date" id="date" required>
        </div>

        <button type="submit">Submit Request</button>
    </form>

  
    <script type="module">
        import { Resend } from 'https://unpkg.com/@resend/browser@latest/dist/browser.mjs';
        const resend = new Resend('re_76APHfKT_CPDRh5gikpQYxs1PWVeDq7L8'); // Replace with your Resend API key

        function toggleTeacherField() {
            const appointmentWith = document.getElementById('appointmentWith').value;
            const teacherField = document.getElementById('teacherField');
            teacherField.style.display = appointmentWith === 'Teacher' ? 'block' : 'none';
            if (appointmentWith !== 'Teacher') document.getElementById('teacherName').value = '';
        }

        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                appointmentWith: document.getElementById('appointmentWith').value,
                teacherName: document.getElementById('teacherName').value,
                date: document.getElementById('date').value
            };

            try {
                const { data, error } = await resend.emails.send({
                    from: 'School Appointment Form <onboarding@resend.dev>',
                    to: 'shahaanikhlas06@gmail.com',
                    subject: 'New Appointment Request',
                    html: `
                        <h3>New Appointment Request</h3>
                        <p><strong>Name:</strong> ${formData.name}</p>
                        <p><strong>Email:</strong> ${formData.email}</p>
                        <p><strong>Phone:</strong> ${formData.phone}</p>
                        <p><strong>Requested Meeting With:</strong> ${formData.appointmentWith}</p>
                        ${formData.teacherName ? `<p><strong>Teacher Name:</strong> ${formData.teacherName}</p>` : ''}
                        <p><strong>Preferred Date:</strong> ${formData.date}</p>
                    `
                });

                if (error) {
                    console.error('Error:', error);
                    alert('Error submitting form. Please try again.');
                } else {
                    alert('Request submitted successfully!');
                    document.getElementById('appointmentForm').reset();
                    toggleTeacherField();
                }
            } catch (err) {
                console.error('Error:', err);
                alert('Error submitting form. Please try again.');
            }
        });
    </script>
</body>
</html>
