<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Appointment Form</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="form-container">
    <h2>Book an Appointment</h2>
    <form id="appointmentForm">
      <label>Name:
        <input type="text" name="name" required />
      </label>
      <label>Phone Number:
        <input type="tel" name="phone" required pattern="^[0-9+\-\s()]{7,}$" />
      </label>
      <label>Email:
        <input type="email" name="email" required />
      </label>
      <label>Whom do you want to meet?
        <select name="person" id="personSelect" required>
          <option value="" disabled selected>Select one</option>
          <option value="Principal">Principal</option>
          <option value="Vice-Principal">Vice-Principal</option>
          <option value="Supervisor KG">Supervisor (KG)</option>
          <option value="Supervisor 1-2">Supervisor (1-2)</option>
          <option value="Supervisor 3-5">Supervisor (3-5)</option>
          <option value="Supervisor 6-8">Supervisor (6-8)</option>
          <option value="Supervisor 9-12">Supervisor (9-12)</option>
          <option value="Admissions Department">Admissions Department</option>
          <option value="Teacher">Teacher</option>
        </select>
      </label>
      <label id="teacherLabel" style="display:none;">
        Specify Teacher:
        <input type="text" name="teacherName" id="teacherNameInput" />
      </label>
      <button type="submit">Submit</button>
      <div id="formMessage"></div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
