<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Appointment Request</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        #teacherField { display: none; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; padding: 12px; }
        button:hover { background-color: #45a049; }
        .error { color: red; display: none; }
    </style>
</head>
<body>
    <h2>School Appointment Request</h2>
    <div id="errorMessage" class="error"></div>
    <form id="appointmentForm">
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label for="appointmentWith">Request Appointment With:</label>
            <select id="appointmentWith" required>
                <option value="">Select Staff Member</option>
                <option value="Principal">Principal</option>
                <option value="Vice Principal">Vice Principal</option>
                <option value="KG Supervisor">KG Supervisor</option>
                <option value="1-2 Supervisor">1-2 Supervisor</option>
                <option value="3-5 Supervisor">3-5 Supervisor</option>
                <option value="6-8 Supervisor">6-8 Supervisor</option>
                <option value="9-12 Supervisor">9-12 Supervisor</option>
                <option value="Admissions Department">Admissions Department</option>
                <option value="Teacher">Teacher</option>
            </select>
        </div>

        <div class="form-group" id="teacherField">
            <label for="teacherName">Specify Teacher Name:</label>
            <input type="text" id="teacherName">
        </div>

        <div class="form-group">
            <label for="date">Preferred Appointment Date:</label>
            <input type="date" id="date" required>
        </div>

        <button type="submit">Submit Request</button>
    </form>

    <script type="module">
        import { Resend } from 'https://cdn.jsdelivr.net/npm/@resend/browser@latest/dist/browser.mjs';

        // Force HTTPS
        if (window.location.protocol !== 'https:') {
            window.location.replace(`https://${window.location.hostname}${window.location.port ? ':' + window.location.port : ''}${window.location.pathname}`);
        }

        const resend = new Resend('re_123456789'); // Replace with your Resend API key

        // Teacher field toggle
        document.getElementById('appointmentWith').addEventListener('change', (e) => {
            const teacherField = document.getElementById('teacherField');
            teacherField.style.display = e.target.value === 'Teacher' ? 'block' : 'none';
            if (e.target.value !== 'Teacher') document.getElementById('teacherName').value = '';
        });

        // Form submission
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.style.display = 'none';

            const formData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                appointmentWith: document.getElementById('appointmentWith').value,
                teacherName: document.getElementById('teacherName').value.trim(),
                date: document.getElementById('date').value
            };

            try {
                const { data, error } = await resend.emails.send({
                    from: 'School Appointments <onboarding@resend.dev>',
                    to: 'shahaanikhlas06@gmail.com',
                    subject: 'New Appointment Request',
                    html: `
                        <h3>New Appointment Request</h3>
                        <p><strong>Name:</strong> ${formData.name}</p>
                        <p><strong>Email:</strong> ${formData.email}</p>
                        <p><strong>Phone:</strong> ${formData.phone}</p>
                        <p><strong>Requested Meeting With:</strong> ${formData.appointmentWith}</p>
                        ${formData.teacherName ? `<p><strong>Teacher Name:</strong> ${formData.teacherName}</p>` : ''}
                        <p><strong>Preferred Date:</strong> ${formData.date}</p>
                    `
                });

                if (error) {
                    errorMessage.textContent = `Error: ${error.message}`;
                    errorMessage.style.display = 'block';
                    return;
                }

                alert('Appointment request submitted successfully!');
                document.getElementById('appointmentForm').reset();
                document.getElementById('teacherField').style.display = 'none';
            } catch (err) {
                errorMessage.textContent = `Error submitting form: ${err.message}`;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
